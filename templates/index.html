<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic AI</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <main class="app">
      <header>
        <div>
          <h1>Cosmic AI</h1>
          <p>Your personal AI assistant</p>
        </div>

        <div class="personality-picker">
          <button
            id="previous-personality"
            type="button"
            aria-label="Previous personality"
          >
            ‹
          </button>

          <div aria-live="polite">
            <strong id="personality-name">🧽 SpongeBob</strong>
            <p id="personality-description">Cheerful, goofy, and optimistic</p>
          </div>

          <button
            id="next-personality"
            type="button"
            aria-label="Next personality"
          >
            ›
          </button>
        </div>

        <span class="status">● Online</span>
      </header>

      <section id="chat-history" class="chat-history"></section>

      <div class="input-area">
        <input
          id="message"
          type="text"
          placeholder="Ask Cosmic AI anything..."
          autocomplete="off"
        />

        <button onclick="sendMessage()">Send</button>
      </div>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
